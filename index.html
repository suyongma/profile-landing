<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mashong | Official Portal</title>
  <meta name="description" content="Official hub and services portal for mashong.com.">
  <meta property="og:title" content="Mashong • Official Portal">
  <meta property="og:description" content="Official portal and services for mashong.com">
  <meta property="og:image" content="./assets/avatar.jpg">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8560052678270280"
     crossorigin="anonymous"></script>
</head>
<body>
  <!-- Ambient background lighting effects -->
  <div class="bg-glow-orb orb-1"></div>
  <div class="bg-glow-orb orb-2"></div>
  <div class="grid-pattern"></div>

  <div class="main-container">
    <!-- Main Profile Card -->
    <main class="profile-card" id="profileCard">
      <!-- Top Action Bar -->
      <header class="card-header">
        <div class="status-badge" id="statusBadge">
          <span class="pulsing-dot"></span>
          <span class="status-text">Online & Ready</span>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="themeToggle" title="테마 변경 (다크/라이트)" aria-label="Toggle Theme">
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Profile Avatar & Title -->
      <section class="profile-hero">
        <div class="avatar-wrapper">
          <div class="avatar-ring"></div>
          <img src="./assets/avatar.jpg" alt="Profile Avatar" class="profile-avatar" id="avatarImg">
          <div class="avatar-badge" title="Verified">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
          </div>
        </div>

        <h1 class="profile-name">Mashong <span class="accent-text">Portal</span></h1>
        <p class="profile-handle">mashong.com • Official Services</p>
      </section>

      <!-- Simplified Links Section -->
      <section class="links-section">
        <h2 class="section-title">
          <span>Services & Links</span>
          <div class="line"></div>
        </h2>

        <!-- Featured Primary Link: STRI TEST -->
        <a href="https://stri.mashong.com" target="_blank" rel="noopener noreferrer" class="link-card featured strike-card" id="link-stri-test">
          <div class="link-icon-box stri-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
          <div class="link-content">
            <div class="link-title-row">
              <span class="link-title text-xl">STRI TEST</span>
              <span class="pill-badge live">Live Service</span>
            </div>
            <p class="link-desc">stri.mashong.com 서비스 바로가기</p>
          </div>
          <div class="link-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
        </a>

        <!-- Secondary Link: GitHub Repository -->
        <a href="https://github.com/suyongma" target="_blank" rel="noopener noreferrer" class="link-card" id="link-github">
          <div class="link-icon-box github-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
            </svg>
          </div>
          <div class="link-content">
            <div class="link-title-row">
              <span class="link-title">GitHub</span>
              <span class="pill-badge">Repositories</span>
            </div>
            <p class="link-desc">github.com/suyongma 저장소 둘러보기</p>
          </div>
          <div class="link-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
        </a>
      </section>

      <!-- Quick Share Button -->
      <section class="quick-actions single-action">
        <button class="action-btn secondary full-width" id="shareCopyUrlBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span class="btn-text">페이지 주소 복사</span>
        </button>
      </section>

      <!-- Card Footer -->
      <footer class="card-footer">
        <div class="footer-badge">
          <span class="cf-icon">⚡</span> Cloudflare Protected • <strong>mashong.com</strong>
        </div>
        <p class="copyright">© 2026 Mashong. All rights reserved.</p>
      </footer>
    </main>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span class="toast-icon">✨</span>
    <span class="toast-msg">클립보드에 복사되었습니다!</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
