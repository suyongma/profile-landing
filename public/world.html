<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>마숑 월드 | MASHONG WORLD</title>
  <meta name="description" content="마숑 월드 - 회원공간 FUN PLAY & INVEST">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13151b" media="(prefers-color-scheme: dark)">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">

  <link rel="stylesheet" href="style.css">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8560052678270280"
     crossorigin="anonymous"></script>
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="page-wrapper">
    <main class="world-container">

      <!-- Top navigation -->
      <header class="world-top-nav reveal" style="--i:0">
        <a href="/" class="action-btn" title="메인 포털로 이동">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>로그아웃</span>
        </a>
        <div class="nav-actions">
          <a href="https://mapt.mashong.com" target="_blank" rel="noopener noreferrer" class="action-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            <span>마PT<span class="label-optional"> 바로가기</span></span>
          </a>
          <button class="action-btn icon-only" data-action="share" type="button" aria-label="공유" title="공유">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Headline -->
      <section class="world-hero peach reveal" style="--i:1">
        <div class="world-icon-badge" aria-hidden="true">🎮</div>
        <div>
          <p class="world-subtitle-tag">MASHONG WORLD</p>
          <h1 class="world-main-heading">회원공간</h1>
        </div>
      </section>

      <!-- Big Cards List -->
      <section class="world-cards-list">

        <a href="https://mashong-games.workers.dev" target="_blank" rel="noopener noreferrer" class="world-big-card lavender reveal" style="--i:2">
          <div class="card-top-meta">
            <span class="meta-index">01</span>
            <span class="meta-category">게임</span>
          </div>
          <div class="card-headline-row">
            <h2 class="card-headline">FUN PLAY</h2>
            <svg class="card-arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
          </div>
          <p class="card-subtext">좀비런 · 꿈의 나라 · 오늘은 투자왕</p>
        </a>

        <a href="#invest" class="world-big-card peach reveal" style="--i:3" data-toast="인베스트 자동매매 서비스 연동 준비 중입니다.">
          <div class="card-top-meta">
            <span class="meta-index">02</span>
            <span class="meta-category">투자</span>
          </div>
          <div class="card-headline-row">
            <h2 class="card-headline">인베스트 (INVEST)</h2>
            <svg class="card-arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
          </div>
          <p class="card-subtext">자동매매 현황과 오늘의 소식</p>
        </a>

      </section>

      <footer class="portal-footer reveal" style="--i:4">
        <p class="copyright">© 2026 MASHONG</p>
      </footer>

    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
